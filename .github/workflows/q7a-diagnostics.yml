name: Q7A diagnostic regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Do not discard an almost finished diagnostic run after another source push.
# This companion does not replace the existing CI workflow or required checks.
concurrency:
  group: q7a-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    name: Independent Windows test collection
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            current/requirements.txt
            current/requirements-dev.txt
      - name: Install repository test dependencies
        working-directory: current
        run: |
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          exit $LASTEXITCODE
      - name: Collect every default test and freeze eight partitions
        working-directory: current
        run: |
          python -B tools/q7a_ci_diagnostics.py collect --out "$env:RUNNER_TEMP/q7a-plan" --shards 8
          exit $LASTEXITCODE
      - name: Preserve the plan, even when collection failed
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: q7a-${{ github.run_attempt }}-plan
          path: |
            ${{ runner.temp }}/q7a-plan/plan.json
            ${{ runner.temp }}/q7a-plan/collection/started.json
            ${{ runner.temp }}/q7a-plan/collection/exit.json
            ${{ runner.temp }}/q7a-plan/collection/events.jsonl
            ${{ runner.temp }}/q7a-plan/collection/junit.xml
            ${{ runner.temp }}/q7a-plan/collection/pytest.log
          if-no-files-found: error
          retention-days: 14

  regression:
    name: Windows shard ${{ matrix.shard }} / 8
    needs: collect
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            current/requirements.txt
            current/requirements-dev.txt
      - name: Install repository test dependencies
        working-directory: current
        run: |
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          exit $LASTEXITCODE
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: q7a-${{ github.run_attempt }}-plan
          path: ${{ runner.temp }}/q7a-plan
      - name: Run the exact assigned IDs; preserve failures and missing tests
        working-directory: current
        run: |
          python -B tools/q7a_ci_diagnostics.py run --plan "$env:RUNNER_TEMP/q7a-plan/plan.json" --index ${{ matrix.shard }} --out "$env:RUNNER_TEMP/q7a-shard" --budget-seconds 2100 --batch-timeout 1200
          exit $LASTEXITCODE
      - name: Preserve only diagnostic evidence, never temporary runtime stores
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: q7a-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/q7a-shard/report.json
            ${{ runner.temp }}/q7a-shard/selection.json
            ${{ runner.temp }}/q7a-shard/progress.json
            ${{ runner.temp }}/q7a-shard/batch-*/started.json
            ${{ runner.temp }}/q7a-shard/batch-*/exit.json
            ${{ runner.temp }}/q7a-shard/batch-*/events.jsonl
            ${{ runner.temp }}/q7a-shard/batch-*/junit.xml
            ${{ runner.temp }}/q7a-shard/batch-*/pytest.log
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: Exact diagnostic coverage and outcomes
    if: always()
    needs: [collect, regression]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: q7a-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/q7a-artifacts
      - name: Require the entire collection, all eight shards and actual phase evidence
        working-directory: current
        env:
          ARTIFACTS: ${{ runner.temp }}/q7a-artifacts
          SUMMARY: ${{ runner.temp }}/q7a-summary.json
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          python -B tools/q7a_ci_diagnostics.py aggregate --plan "$ARTIFACTS/q7a-$ATTEMPT-plan/plan.json" --artifacts "$ARTIFACTS" --out "$SUMMARY"
      - name: Preserve aggregate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: q7a-${{ github.run_attempt }}-summary
          path: ${{ runner.temp }}/q7a-summary.json
          if-no-files-found: error
          retention-days: 14
