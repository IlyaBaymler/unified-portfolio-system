name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# The terminal job retains the existing required-check name. A collection or
# individual shard cannot satisfy the primary qualification on its own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    name: Primary Windows checks and full collection
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    defaults:
      run:
        shell: pwsh
    env:
      MPLBACKEND: Agg
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            current/requirements.txt
            current/requirements-dev.txt
      - name: Configure runner temp paths
        run: |
          $pycache = Join-Path $env:RUNNER_TEMP "pycache"
          "PYTHONPYCACHEPREFIX=$pycache" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Install repository test dependencies
        working-directory: current
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          exit $LASTEXITCODE
      - name: Run critical Ruff checks
        working-directory: current
        run: python -m ruff check --select E9,F63,F7,F82 .

      - name: Run strict v3.9 Ruff checks
        working-directory: current
        run: |
          $targets = @(
            Get-Item -LiteralPath "trading_robot/central_order_coordinator.py"
            Get-Item -LiteralPath "trading_robot/central_order_manager.py"
            Get-Item -LiteralPath "trading_robot/journal.py"
            Get-Item -LiteralPath "trading_robot/portfolio_repository.py"
            Get-Item -LiteralPath "trading_robot/risk_persistence.py"
            Get-Item -LiteralPath "trading_robot/runtime_backup.py"
            Get-Item -LiteralPath "trading_robot/sandbox_execution_adapter.py"
            Get-ChildItem -LiteralPath "trading_robot" -Filter "portfolio_risk*.py" -File
            Get-ChildItem -LiteralPath "tools" -Filter "v3_9_*.py" -File
            Get-ChildItem -LiteralPath "tests" -Filter "test_portfolio_risk*_v3_9.py" -File
            Get-ChildItem -LiteralPath "tests" -Filter "test_v3_9_*.py" -File
          ) | ForEach-Object { $_.FullName } | Sort-Object -Unique
          if (-not $targets) {
            throw "No v3.9 Ruff targets were found."
          }
          python -m ruff check -- $targets

      - name: Compile Python sources
        working-directory: current
        run: python -m compileall -q -f trading_robot tools tests

      - name: Collect every default test and freeze evidence-weighted partitions
        id: plan
        working-directory: current
        run: |
          python -B tools/q7a_ci_diagnostics.py collect --out "$env:RUNNER_TEMP/ci-plan" --shards 32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $plan = Get-Content -LiteralPath "$env:RUNNER_TEMP/ci-plan/plan.json" -Raw | ConvertFrom-Json
          $indices = @(0..($plan.partitions.Count - 1)) | ConvertTo-Json -Compress
          "shards=$indices" >> $env:GITHUB_OUTPUT
      - name: Preserve the plan, even when collection failed
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-${{ github.run_attempt }}-plan
          path: |
            ${{ runner.temp }}/ci-plan/plan.json
            ${{ runner.temp }}/ci-plan/collection/started.json
            ${{ runner.temp }}/ci-plan/collection/exit.json
            ${{ runner.temp }}/ci-plan/collection/events.jsonl
            ${{ runner.temp }}/ci-plan/collection/junit.xml
            ${{ runner.temp }}/ci-plan/collection/pytest.log
          if-no-files-found: error
          retention-days: 14

  regression:
    name: Primary Windows duration-aware shard ${{ matrix.shard }}
    needs: collect
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: ${{ fromJSON(needs.collect.outputs.shards) }}
    defaults:
      run:
        shell: pwsh
    env:
      MPLBACKEND: Agg
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            current/requirements.txt
            current/requirements-dev.txt
      - name: Install repository test dependencies
        working-directory: current
        run: |
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          exit $LASTEXITCODE
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-${{ github.run_attempt }}-plan
          path: ${{ runner.temp }}/ci-plan
      - name: Run the exact assigned IDs; preserve failures and missing tests
        working-directory: current
        run: |
          python -B tools/q7a_ci_diagnostics.py run --plan "$env:RUNNER_TEMP/ci-plan/plan.json" --index ${{ matrix.shard }} --out "$env:RUNNER_TEMP/ci-shard" --budget-seconds 2100 --batch-timeout 1200
          exit $LASTEXITCODE
      - name: Preserve only primary evidence, never temporary runtime stores
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/ci-shard/report.json
            ${{ runner.temp }}/ci-shard/selection.json
            ${{ runner.temp }}/ci-shard/progress.json
            ${{ runner.temp }}/ci-shard/batch-*/started.json
            ${{ runner.temp }}/ci-shard/batch-*/exit.json
            ${{ runner.temp }}/ci-shard/batch-*/events.jsonl
            ${{ runner.temp }}/ci-shard/batch-*/junit.xml
            ${{ runner.temp }}/ci-shard/batch-*/pytest.log
          if-no-files-found: error
          retention-days: 14

  windows-python-3-12:
    name: Windows / Python 3.12
    if: always()
    needs: [collect, regression]
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
        working-directory: current
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ci-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/ci-artifacts
      - name: Require independent primary custody, full coverage and real outcomes
        env:
          ARTIFACTS: ${{ runner.temp }}/ci-artifacts
          SUMMARY: ${{ runner.temp }}/ci-summary.json
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          COLLECTION_RESULT: ${{ needs.collect.result }}
          REGRESSION_RESULT: ${{ needs.regression.result }}
        run: |
          $planPath = Join-Path $env:ARTIFACTS "ci-$env:GITHUB_RUN_ATTEMPT-plan/plan.json"
          $plan = Get-Content -LiteralPath $planPath -Raw | ConvertFrom-Json
          if (-not $env:GITHUB_RUN_ID -or -not $env:GITHUB_RUN_ATTEMPT -or -not $env:EXPECTED_HEAD) {
            throw "Primary hosted identity is unavailable."
          }
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tree = git rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($plan.identity.mode -cne "GIT" -or $plan.identity.head -cne $head -or
              $head -cne $env:EXPECTED_HEAD -or $plan.identity.tree -cne $tree -or
              $plan.run_id -cne $env:GITHUB_RUN_ID -or $plan.run_attempt -cne $env:GITHUB_RUN_ATTEMPT) {
            throw "Primary plan does not belong to this exact commit/tree/run/attempt."
          }
          python -B tools/q7a_ci_diagnostics.py aggregate --plan "$planPath" --artifacts "$env:ARTIFACTS" --out "$env:SUMMARY"
          $aggregateExit = $LASTEXITCODE
          if ($aggregateExit -ne 0) { exit $aggregateExit }
          if ($env:COLLECTION_RESULT -cne "success" -or $env:REGRESSION_RESULT -cne "success") {
            throw "Primary dependencies did not all finish successfully."
          }
      - name: Preserve independent primary aggregate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-${{ github.run_attempt }}-summary
          path: ${{ runner.temp }}/ci-summary.json
          if-no-files-found: error
          retention-days: 14
