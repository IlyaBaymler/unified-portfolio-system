name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
    paths:
      - 'current/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'current/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            current/requirements.txt
            current/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r current/requirements.txt
          python -m pip install -r current/requirements-dev.txt

      - name: Compile source
        run: python -m compileall -q current

      - name: Run tests
        run: python -m pytest -q current/tests
